{% extends "base.html" %}
{% block title %}Get a {{ proof_name }}{% endblock %}
{% block content %}
  <section class="card form-card">
    <div class="proof-icon" aria-hidden="true">{{ icon }}</div>
    <p class="eyebrow">Contact verification</p>
    <h1>Get a {{ proof_name }}</h1>
    <p class="lead">{{ description }}</p>

    <form class="proof-form" action="{{ submit_url }}" method="post">
      <label for="proof-subject">{{ field_label }}</label>
      <input
        id="proof-subject"
        name="{{ field_name }}"
        type="{{ input_type }}"
        value="{{ value }}"
        autocomplete="{{ autocomplete }}"
        required
        autofocus
      >
      <button class="submit-button" type="submit">
        <span class="button-label">Continue</span>
        <span class="button-loading" role="status" aria-live="polite">
          <span class="button-spinner" aria-hidden="true"></span>
          Please wait…
        </span>
      </button>
    </form>

    <p class="hint">You will verify your {{ contact_name }} on this site before opening your wallet.</p>
  </section>

  <script>
    const proofForm = document.querySelector(".proof-form");
    const submitButton = proofForm.querySelector(".submit-button");

    proofForm.addEventListener("submit", () => {
      submitButton.disabled = true;
      submitButton.classList.add("is-loading");
      submitButton.setAttribute("aria-busy", "true");
    });

    window.addEventListener("pageshow", () => {
      submitButton.disabled = false;
      submitButton.classList.remove("is-loading");
      submitButton.removeAttribute("aria-busy");
    });
  </script>
{% endblock %}
